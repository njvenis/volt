version: 2
updates:
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      react-runtime:
        patterns:
          - "react"
          - "react-dom"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
