name: Synthetic artifact upload compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      producer_run_id:
        description: Successful run ID from this workflow to download and verify
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run_id: ${{ github.run_id }}
    steps:
      - name: Create nested synthetic artifact and SHA-256 manifest
        env:
          ARTIFACT_ROOT: ${{ runner.temp }}/volt-synthetic-artifact
        run: |
          mkdir -p "$ARTIFACT_ROOT/payload/deep"
          printf '%s\n' 'VOLT synthetic GitHub Actions artifact compatibility fixture' > "$ARTIFACT_ROOT/payload/deep/synthetic.txt"
          (cd "$ARTIFACT_ROOT" && sha256sum payload/deep/synthetic.txt > SHA256SUMS)

      - name: Upload synthetic artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volt-synthetic-artifact-compat
          path: ${{ runner.temp }}/volt-synthetic-artifact/
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: produce
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout verifier
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"

      - name: Download same-run or supplied producer artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: volt-synthetic-artifact-compat
          path: ${{ runner.temp }}/volt-synthetic-downloaded
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.producer_run_id || needs.produce.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify exact filenames, nested layout, and SHA-256
        run: python tools/release/verify_synthetic_artifact.py "${RUNNER_TEMP}/volt-synthetic-downloaded"
