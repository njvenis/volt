name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.13.15"
      NODE_VERSION: "24.21.0"
      UV_VERSION: "0.12.18"
      OPENSPEC_VERSION: "1.11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Self-contained synthetic test suites
        run: |
          uv run python -m unittest discover -s tests/engine -v
          uv run python -m unittest discover -s tests/identity -v
          uv run python -m unittest tests.ingestion.test_run -v
          uv run python -m unittest tests.operations.test_compose_bundle -v
          uv run python -m unittest tests.operations.test_compose_oidc_mode -v
          mkdir -p "$RUNNER_TEMP/volt-compose-bundle"
          uv run python tools/build_compose_bundle.py build --output "$RUNNER_TEMP/volt-compose-bundle/volt-compose.tar.gz"
          uv run python tools/build_compose_bundle.py verify --archive "$RUNNER_TEMP/volt-compose-bundle/volt-compose.tar.gz"

      - name: Install UI dependencies and build
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          node --test ui/tests/public-g4-fixtures.test.mjs

      - name: Install pinned OpenSpec and validate
        run: |
          npm --prefix tools/g0_ci/openspec ci
          test "$(tools/g0_ci/openspec/node_modules/.bin/openspec --version)" = "${OPENSPEC_VERSION}"
          tools/g0_ci/openspec/node_modules/.bin/openspec validate --all --strict

      - name: Check links and public source hygiene
        run: |
          uv run python -m unittest discover -s tests/public_check -v
          uv run python tools/public_check.py .
