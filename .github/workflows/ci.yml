name: Portable checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portable-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHON_VERSION: "3.13.15"
      NODE_VERSION: "24.21.0"
      UV_VERSION: "0.12.18"
      OPENSPEC_VERSION: "1.11.0"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Self-contained synthetic test suites
        run: |
          uv run python -m unittest discover -s tests/engine -v
          uv run python -m unittest discover -s tests/identity -v
          uv run python -m unittest tests.ingestion.test_run -v

      - name: Install UI dependencies and build
        run: |
          npm --prefix ui ci
          npm --prefix ui run build
          node --test ui/tests/public-g4-fixtures.test.mjs

      - name: Install pinned OpenSpec and validate
        run: |
          npm --prefix tools/g0_ci/openspec ci
          test "$(tools/g0_ci/openspec/node_modules/.bin/openspec --version)" = "${OPENSPEC_VERSION}"
          tools/g0_ci/openspec/node_modules/.bin/openspec validate --all --strict

      - name: Check links and public source hygiene
        run: |
          uv run python -m unittest discover -s tests/public_check -v
          uv run python tools/public_check.py .
