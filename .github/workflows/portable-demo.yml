name: Portable local demo

on:
  push:
    branches:
      - demo/portable-install

permissions:
  contents: read

concurrency:
  group: portable-demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-platform-demo:
    name: Native ${{ matrix.arch }} demo
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            platform: linux/arm64
    env:
      PYTHON_VERSION: "3.13.15"
      NODE_VERSION: "24.21.0"
      UV_VERSION: "0.12.18"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned uv and project dependencies
        run: |
          python -m pip install "uv==${UV_VERSION}"
          uv sync --locked

      - name: Install browser dependencies
        run: |
          npm --prefix ui ci
          (cd ui && npx playwright install --with-deps chromium)

      - name: Check target Dockerfile
        run: |
          CE_IMAGE="$(python3 tools/release/portable_demo.py ce-image --platform "${{ matrix.platform }}")"
          docker buildx build --check --platform "${{ matrix.platform }}" --build-arg "CE_IMAGE=$CE_IMAGE" -f Dockerfile.g7 .

      - name: Build and package native local demo
        run: |
          mkdir -p "$RUNNER_TEMP/portable-demo"
          python3 tools/release/portable_demo.py build \
            --platform "${{ matrix.platform }}" \
            --output "$RUNNER_TEMP/portable-demo/volt-portable-demo-${{ matrix.arch }}.tar.gz"

      - name: Verify and load the package
        run: |
          python3 tools/release/portable_demo.py verify \
            --archive "$RUNNER_TEMP/portable-demo/volt-portable-demo-${{ matrix.arch }}.tar.gz"
          python3 tools/release/portable_demo.py load \
            --archive "$RUNNER_TEMP/portable-demo/volt-portable-demo-${{ matrix.arch }}.tar.gz"

      - name: Capture portable package metadata and Compose installer
        run: |
          python3 tools/build_compose_bundle.py build \
            --output "$RUNNER_TEMP/portable-demo/compose-bundle.tar.gz"
          python3 - "$RUNNER_TEMP/portable-demo/volt-portable-demo-${{ matrix.arch }}.tar.gz" "$GITHUB_ENV" <<'PY'
          import json, sys, tarfile
          with tarfile.open(sys.argv[1], "r:gz") as archive:
              name = next(n for n in archive.getnames() if n.endswith("/manifest.json"))
              manifest = json.load(archive.extractfile(name))
          with open(sys.argv[2], "a", encoding="utf-8") as env:
              env.write(f"PORTABLE_IMAGE_ID={manifest['image_id']}\n")
              env.write(f"PORTABLE_SOURCE_SNAPSHOT={manifest['source_snapshot']}\n")
              env.write(f"PORTABLE_PLATFORM={manifest['platform']}\n")
          PY
      - name: Run local Compose and browser qualification
        run: |
          python3 tools/compose_release_qualification.py \
            --image-id "$PORTABLE_IMAGE_ID" \
            --source-snapshot "$PORTABLE_SOURCE_SNAPSHOT" \
            --source-commit "$GITHUB_SHA" \
            --version 0.1.0-demo \
            --development-fixture \
            --platform "$PORTABLE_PLATFORM" \
            --bundle "$RUNNER_TEMP/portable-demo/compose-bundle.tar.gz" \
            --evidence "$RUNNER_TEMP/portable-demo/evidence" \
            --private-tmp "$RUNNER_TEMP" \
            --bundle-tmp "$RUNNER_TEMP" \
            --project-prefix "volt-port-${{ matrix.arch }}"

      - name: Retain package and native qualification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: volt-portable-demo-${{ matrix.arch }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/portable-demo/volt-portable-demo-${{ matrix.arch }}.tar.gz
            ${{ runner.temp }}/portable-demo/evidence/
          if-no-files-found: ignore
          retention-days: 14
