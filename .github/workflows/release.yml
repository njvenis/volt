name: Prepare and publish VOLT RC2

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful candidate workflow run to publish (blank prepares only)
        type: string
        required: false
        default: ""
      publish_approved:
        description: Maintainer explicitly approves publishing the named retained RC2 candidate
        type: boolean
        required: true
        default: false
      recovery_mode:
        description: Use an explicitly identified earlier approved main candidate with this main-branch controller
        type: boolean
        required: true
        default: false
      candidate_source_sha:
        description: Required only for recovery mode; exact source commit embedded in the approved candidate
        type: string
        required: false
        default: ""
      candidate_artifact_id:
        description: Required only for recovery mode; exact retained Actions artifact ID
        type: string
        required: false
        default: ""
      candidate_artifact_digest:
        description: Required only for recovery mode; exact retained Actions artifact sha256 digest
        type: string
        required: false
        default: ""
      candidate_archive_sha256:
        description: Required only for recovery mode; exact SHA-256 of the retained candidate tar
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: volt-rc2-release
  cancel-in-progress: false

jobs:
  gates:
    if: github.ref == 'refs/heads/main' && inputs.candidate_run_id == ''
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.13.15"
      NODE_VERSION: "24.21.0"
      UV_VERSION: "0.12.18"
      OPENSPEC_VERSION: "1.11.0"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact main source and unused version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"
          test -z "$(git tag --list v0.1.0-rc.2)"
          image=$(sed -n 's/^gitleaks_image=//p' tools/release/tools.lock)
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" dir . --config tools/release/gitleaks.toml
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" git . --config tools/release/gitleaks.toml --log-opts=--all
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Portable checks
        run: |
          python3 tools/release/install_actionlint.py
          /tmp/volt-release-tools/actionlint .github/workflows/release.yml .github/workflows/security.yml .github/workflows/ci.yml
          uv sync --locked
          uv run python -m unittest discover -s tests/engine -v
          uv run python -m unittest discover -s tests/identity -v
          uv run python -m unittest tests.ingestion.test_run -v
          uv run python -m unittest discover -s tests/release -v
          uv run python -m unittest discover -s tests/public_check -v
          uv run python tools/public_check.py .
          npm --prefix ui ci
          npm --prefix ui run check:api
          npm --prefix ui run build
          (cd ui && npx playwright install --with-deps chromium)
          node --test ui/tests/*.test.mjs
          npm --prefix tools/g0_ci/openspec ci
          test "$(tools/g0_ci/openspec/node_modules/.bin/openspec --version)" = "${OPENSPEC_VERSION}"
          tools/g0_ci/openspec/node_modules/.bin/openspec validate --all --strict
      - name: Build immutable candidate image once
        run: |
          out="$RUNNER_TEMP/volt-rc2"
          mkdir -p "$out"
          echo "RELEASE_OUT=$out" >> "$GITHUB_ENV"
          printf '%s\n' "$GITHUB_RUN_ID" > "$out/prepare-run-id.txt"
          git archive --format=tar --output="$out/source.tar" "$GITHUB_SHA"
          source_snapshot="sha256:$(sha256sum "$out/source.tar" | cut -d' ' -f1)"
          printf '%s\n' "$source_snapshot" > "$out/source-snapshot.txt"
          docker build --platform linux/amd64 \
            --build-arg VOLT_SOURCE_SNAPSHOT="$source_snapshot" \
            --label org.opencontainers.image.version=0.1.0-rc.2 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            --label org.volt.oidc-deployment-modes=demo,external \
            --label org.volt.compose.source-snapshot="$source_snapshot" \
            --label org.volt.compose-install.contract=1 \
            -f Dockerfile.g7 -t volt-rc2:candidate .
          docker image inspect volt-rc2:candidate --format '{{.Id}}' > "$out/image-id.txt"
          docker save --output "$out/image.tar" volt-rc2:candidate
          git bundle create "$out/source.bundle" HEAD
          uv run python tools/build_compose_bundle.py build --output "$out/compose-qualification.tar.gz"
      - name: Qualify the immutable image through source-free Compose and cold restore
        run: |
          python3 tools/compose_release_qualification.py \
            --image-id "$(cat "$RELEASE_OUT/image-id.txt")" \
            --source-snapshot "$(cat "$RELEASE_OUT/source-snapshot.txt")" \
            --source-commit "$GITHUB_SHA" --version 0.1.0-rc.2 \
            --bundle "$RELEASE_OUT/compose-qualification.tar.gz" \
            --evidence "$RELEASE_OUT/compose-evidence"
      - name: Retain Compose qualification evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc2-compose-qualification-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc2/compose-evidence/
          if-no-files-found: ignore
          retention-days: 30
      - name: Validate saved image archive before import and transfer
        run: |
          python3 - <<'PYIMAGE'
          import json
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from archive import validate_docker_archive
          root = Path(os.environ["RELEASE_OUT"])
          expected = {
              "image_id": (root / "image-id.txt").read_text().strip(),
              "source_commit": os.environ["GITHUB_SHA"],
              "source_snapshot": (root / "source-snapshot.txt").read_text().strip(),
              "version": "0.1.0-rc.2",
              "platform": "linux/amd64",
          }
          identity = validate_docker_archive(root / "image.tar", expected)
          print(json.dumps(identity, sort_keys=True))
          PYIMAGE
      - name: Exercise fresh offline image load and no-build release path
        run: |
          out="$RUNNER_TEMP/volt-rc2"
          state="$RUNNER_TEMP/volt-rc2-preview-state"
          evidence="$out/local-preview"
          mkdir -p "$evidence"
          export XDG_STATE_HOME="$state"
          cleanup() {
            if test -f "$state/volt/g7-preview/rc2/instance.json"; then
              python3 tools/g7_local_preview.py destroy rc2 || true
            fi
          }
          trap cleanup EXIT
          image_id=$(cat "$out/image-id.txt")
          docker image rm volt-rc2:candidate
          if docker image inspect "$image_id" >/dev/null 2>&1; then
            echo "candidate image unexpectedly remained loaded after removal" >&2
            exit 1
          fi
          docker load --input "$out/image.tar"
          docker image inspect "$image_id" --format '{{.Id}}' | grep -Fx "$image_id"
          python3 tools/g7_local_preview.py init rc2 --api-port 8180 --oidc-port 8190
          python3 tools/g7_local_preview.py start rc2 --no-build \
            --expected-image-id "$image_id" \
            --expected-image-source-revision "$GITHUB_SHA" \
            --expected-image-version 0.1.0-rc.2 \
            --expected-platform linux/amd64
          python3 tools/g7_local_preview.py wait rc2
          python3 tools/g7_local_preview.py link-admin rc2
          python3 tools/g7_local_preview.py smoke rc2 --evidence "$evidence"
          python3 tools/g7_local_preview.py stop rc2
          python3 tools/g7_local_preview.py restart rc2
          python3 tools/g7_local_preview.py wait rc2
          python3 tools/g7_local_preview.py smoke rc2 --readback --evidence "$evidence"
          python3 tools/g7_local_preview.py destroy rc2
          test ! -e "$state/volt/g7-preview/rc2"
      - name: Retain fresh offline install evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc2-fresh-install-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc2/local-preview/
          if-no-files-found: ignore
          retention-days: 30
      - name: Create and verify image-bound notices and SBOMs
        run: |
          python3 tools/notices/prepare_release_sources.py --output "$RELEASE_OUT/source-preparation"
          python3 tools/release/install_syft.py
          python3 tools/notices/collect.py --image "$(cat "$RELEASE_OUT/image-id.txt")" \
            --output "$RELEASE_OUT/notices" --syft /tmp/volt-release-tools/syft \
            --debian-dispositions "$RELEASE_OUT/source-preparation/debian-source-dispositions.json" \
            --debian-developer-keyring "$RELEASE_OUT/source-preparation/debian-developer-keyring.gpg"
          python3 tools/notices/verify.py --directory "$RELEASE_OUT/notices" --image "$(cat "$RELEASE_OUT/image-id.txt")"
      - name: Fail-closed full-image vulnerability scan
        run: |
          python3 tools/release/install_trivy.py
          export PATH="/tmp/volt-release-tools:$PATH"
          python3 tools/release/scan.py --image "$(cat "$RELEASE_OUT/image-id.txt")" --expected-image-id "$(cat "$RELEASE_OUT/image-id.txt")" --exceptions tools/release/exceptions.example.json --output "$RELEASE_OUT/release-scan.json"
      - name: Retain full scan report on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc2-scan-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc2/release-scan.json*
          if-no-files-found: ignore
          retention-days: 30
      - name: Pack exact candidate inputs for portable artifact transfer
        run: |
          python3 - <<'PYTRANSFER'
          import os
          import tarfile
          from pathlib import Path
          root = Path(os.environ["RELEASE_OUT"])
          archive = Path(os.environ["RUNNER_TEMP"]) / "volt-rc2-candidate.tar"
          with tarfile.open(archive, "w", dereference=True) as output:
              for path in sorted(root.iterdir()):
                  output.add(path, arcname=path.name)
          PYTRANSFER
      - name: Upload exact candidate inputs; no publication credentials
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc2-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc2-candidate.tar
          if-no-files-found: error
          retention-days: 30

  publish:
    if: github.ref == 'refs/heads/main' && inputs.candidate_run_id != '' && inputs.publish_approved == true
    runs-on: ubuntu-24.04
    environment: volt-rc1-publication
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify named successful candidate run identity
        id: candidate_identity
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          REQUESTED_CANDIDATE_SOURCE: ${{ inputs.candidate_source_sha }}
          EXPECTED_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          EXPECTED_ARTIFACT_DIGEST: ${{ inputs.candidate_artifact_digest }}
          EXPECTED_CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          source_sha="$GITHUB_SHA"
          args=()
          if [[ "$RECOVERY_MODE" == true ]]; then
            [[ "$REQUESTED_CANDIDATE_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            [[ "$EXPECTED_ARTIFACT_ID" =~ ^[0-9]+$ ]]
            [[ "$EXPECTED_ARTIFACT_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$EXPECTED_CANDIDATE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
            source_sha="$REQUESTED_CANDIDATE_SOURCE"
            args+=(--artifact-id "$EXPECTED_ARTIFACT_ID" --artifact-digest "$EXPECTED_ARTIFACT_DIGEST")
            git merge-base --is-ancestor "$source_sha" origin/main
          else
            test -z "$REQUESTED_CANDIDATE_SOURCE"
            test -z "$EXPECTED_ARTIFACT_ID"
            test -z "$EXPECTED_ARTIFACT_DIGEST"
            test -z "$EXPECTED_CANDIDATE_ARCHIVE_SHA256"
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          printf 'source_sha=%s\n' "$source_sha" >> "$GITHUB_OUTPUT"
          python3 tools/release/verify_candidate_run.py --run-id "$CANDIDATE_RUN_ID" \
            --source "$source_sha" --controller-source "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" --workflow .github/workflows/release.yml \
            "${args[@]}" > "$RUNNER_TEMP/candidate-identity.json"
          cat "$RUNNER_TEMP/candidate-identity.json"
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: volt-rc2-candidate-${{ steps.candidate_identity.outputs.source_sha }}
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/volt-rc2-transfer
      - name: Restore exact candidate inputs
        env:
          RECOVERY_MODE: ${{ inputs.recovery_mode }}
          EXPECTED_CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/volt-rc2-transfer/volt-rc2-candidate.tar"
          if [[ "$RECOVERY_MODE" == true ]]; then
            actual="$(sha256sum "$archive" | cut -d' ' -f1)"
            test "$actual" = "$EXPECTED_CANDIDATE_ARCHIVE_SHA256"
          fi
          python3 - <<'PYTRANSFER'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, "tools/release")
          from archive import safe_extract
          root = Path(os.environ["RUNNER_TEMP"])
          safe_extract(root / "volt-rc2-transfer/volt-rc2-candidate.tar", root / "volt-rc2")
          PYTRANSFER
      - name: Revalidate retained candidate contents before registry writes
        env:
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate_identity.outputs.source_sha }}
        run: python3 tools/release/verify_candidate_artifact.py --directory "$RUNNER_TEMP/volt-rc2" --source "$CANDIDATE_SOURCE_SHA" --prepare-run-id "$CANDIDATE_RUN_ID"
      - name: Verify explicit approval and required environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/volt-rc1-publication" > "$RUNNER_TEMP/environment.json"
          python3 tools/release/guards.py --approved '${{ inputs.publish_approved }}' \
            --environment-json "$RUNNER_TEMP/environment.json" \
            --approval-reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
      - name: Recheck exact source and immutable destination tags
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate_identity.outputs.source_sha }}
          GITHUB_ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git tag --list v0.1.0-rc.2)"
          git merge-base --is-ancestor "$CANDIDATE_SOURCE_SHA" origin/main
          test -z "$(git tag --list v0.1.0-rc.2)"
          python3 tools/release/registry.py --version-tag 0.1.0-rc.2 --sha-tag "sha-$CANDIDATE_SOURCE_SHA"
      - name: Install pinned Cosign and establish offline verification root
        run: |
          python3 tools/release/install_cosign.py
          echo /tmp/volt-release-tools >> "$GITHUB_PATH"
          /tmp/volt-release-tools/cosign initialize
      - name: Publish the already-gated image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate_identity.outputs.source_sha }}
        run: |
          set -euo pipefail
          VOLT_PREPARE_RUN_ID="$(cat "$RUNNER_TEMP/volt-rc2/prepare-run-id.txt")"
          export VOLT_PREPARE_RUN_ID
          VOLT_CANDIDATE_SOURCE_SHA="$CANDIDATE_SOURCE_SHA"
          export VOLT_CANDIDATE_SOURCE_SHA
          VOLT_CONTROLLER_COMMIT="$GITHUB_SHA"
          export VOLT_CONTROLLER_COMMIT
          VOLT_CANDIDATE_ARTIFACT_ID="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "candidate-identity.json")))["artifact_id"])')"
          VOLT_CANDIDATE_ARTIFACT_DIGEST="$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "candidate-identity.json")))["artifact_digest"])')"
          VOLT_CANDIDATE_ARCHIVE_SHA256="$(sha256sum "$RUNNER_TEMP/volt-rc2-transfer/volt-rc2-candidate.tar" | cut -d' ' -f1)"
          VOLT_RECOVERY_MODE='${{ inputs.recovery_mode }}'
          export VOLT_CANDIDATE_ARTIFACT_ID VOLT_CANDIDATE_ARTIFACT_DIGEST VOLT_CANDIDATE_ARCHIVE_SHA256 VOLT_RECOVERY_MODE
          image_id=$(cat "$RUNNER_TEMP/volt-rc2/image-id.txt")
          docker load --input "$RUNNER_TEMP/volt-rc2/image.tar"
          docker image inspect "$image_id" --format '{{.Id}}' | grep -Fx "$image_id"
          registry=ghcr.io/njvenis/volt
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          docker tag "$image_id" "$registry:0.1.0-rc.2"
          docker tag "$image_id" "$registry:sha-$CANDIDATE_SOURCE_SHA"
          docker push "$registry:sha-$CANDIDATE_SOURCE_SHA"
          docker push "$registry:0.1.0-rc.2"
          repo_digest=$(docker image inspect "$registry:0.1.0-rc.2" --format '{{index .RepoDigests 0}}')
          digest="${repo_digest##*@}"
          test "${digest#sha256:}" != "$digest"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/volt-rc2/registry-digest.txt"
          /tmp/volt-release-tools/cosign sign --yes "$registry@$digest"
          /tmp/volt-release-tools/cosign attest --yes --type spdxjson \
            --predicate "$RUNNER_TEMP/volt-rc2/notices/sbom.spdx.json" "$registry@$digest"
          python3 - <<'PY'
          import json, os
          server = os.environ["GITHUB_SERVER_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          source = f"{server}/{repository}"
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"]
          sha = os.environ["VOLT_CANDIDATE_SOURCE_SHA"]
          predicate = {
              "buildDefinition": {
                  "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
                  "externalParameters": {
                      "workflow": {"ref": workflow_ref, "repository": source},
                      "source": {"uri": source, "ref": sha},
                  },
                  "internalParameters": {
                      "voltCandidatePreparationRun": os.environ["VOLT_PREPARE_RUN_ID"],
                      "voltPublicationRun": os.environ["GITHUB_RUN_ID"],
                      "voltReleaseController": {
                          "commit": os.environ["VOLT_CONTROLLER_COMMIT"],
                          "workflow_ref": workflow_ref,
                          "candidate_source_commit": sha,
                          "candidate_run_id": os.environ["VOLT_PREPARE_RUN_ID"],
                          "publication_run_id": os.environ["GITHUB_RUN_ID"],
                          "artifact_id": os.environ["VOLT_CANDIDATE_ARTIFACT_ID"],
                          "artifact_digest": os.environ["VOLT_CANDIDATE_ARTIFACT_DIGEST"],
                          "candidate_archive_sha256": os.environ["VOLT_CANDIDATE_ARCHIVE_SHA256"],
                          "recovery_mode": os.environ["VOLT_RECOVERY_MODE"] == "true",
                      },
                  },
                  "resolvedDependencies": [{"uri": f"git+{source}", "digest": {"gitCommit": sha}}],
              },
              "runDetails": {
                  "builder": {"id": "https://github.com/actions/runner"},
                  "metadata": {"invocationId": f"{server}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "volt-rc2", "provenance.json"), "w") as output:
              json.dump(predicate, output, sort_keys=True)
              output.write("\n")
          PY
          /tmp/volt-release-tools/cosign attest --yes --type slsaprovenance1 \
            --predicate "$RUNNER_TEMP/volt-rc2/provenance.json" "$registry@$digest"
          python3 tools/release/registry.py --version-tag 0.1.0-rc.2 --sha-tag "sha-$CANDIDATE_SOURCE_SHA" --expected-digest "$digest"
          python3 tools/release/publication_verify.py --cosign /tmp/volt-release-tools/cosign --digest "$digest" --source "$CANDIDATE_SOURCE_SHA" --controller-commit "$GITHUB_SHA" --image-id "$image_id" --spdx "$RUNNER_TEMP/volt-rc2/notices/sbom.spdx.json" --provenance "$RUNNER_TEMP/volt-rc2/provenance.json" --notice-manifest "$RUNNER_TEMP/volt-rc2/notices/notice-manifest.json"
          mkdir -p "$RUNNER_TEMP/volt-rc2-approved-source"
          git archive "$CANDIDATE_SOURCE_SHA" deploy/compose | tar -x -C "$RUNNER_TEMP/volt-rc2-approved-source"
          python3 tools/build_compose_bundle.py build --output "$RUNNER_TEMP/volt-rc2/volt-compose.tar.gz" --image-reference "$registry@$digest" --source-root "$RUNNER_TEMP/volt-rc2-approved-source"
          python3 tools/build_compose_bundle.py verify --archive "$RUNNER_TEMP/volt-rc2/volt-compose.tar.gz" --source-root "$RUNNER_TEMP/volt-rc2-approved-source"
          (cd "$RUNNER_TEMP/volt-rc2" && sha256sum volt-compose.tar.gz > volt-compose.tar.gz.sha256)
      - name: Sign and assemble the offline image archive
        env:
          CANDIDATE_SOURCE_SHA: ${{ steps.candidate_identity.outputs.source_sha }}
        run: |
          out="$RUNNER_TEMP/volt-rc2"
          rm -f "$out/compose-qualification.tar.gz"
          cp -a "$out/notices/." "$out/"
          git show "$CANDIDATE_SOURCE_SHA:tools/release/VERIFY.txt" > "$out/VERIFY.txt"
          python3 tools/release/archive.py prepare --directory "$out" \
            --version 0.1.0-rc.2 --source-sha "$CANDIDATE_SOURCE_SHA" \
            --image-id "$(cat "$out/image-id.txt")" --registry-digest "$(cat "$out/registry-digest.txt")" \
            --platform linux/amd64
          python3 tools/release/archive.py sign --directory "$out" --cosign /tmp/volt-release-tools/cosign \
            --production-oidc --approval "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          python3 tools/release/archive.py pack --directory "$out" \
            --archive "$RUNNER_TEMP/volt-0.1.0-rc.2-linux-amd64.tar"
          python3 tools/release/archive.py verify --archive "$RUNNER_TEMP/volt-0.1.0-rc.2-linux-amd64.tar" \
            --cosign /tmp/volt-release-tools/cosign --source-sha "$CANDIDATE_SOURCE_SHA" \
            --image-id "$(cat "$out/image-id.txt")"
