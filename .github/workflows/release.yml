name: Prepare and publish VOLT RC1

on:
  workflow_dispatch:
    inputs:
      publish_approved:
        description: Maintainer explicitly approves publishing this exact RC1 candidate
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: volt-rc1-release
  cancel-in-progress: false

jobs:
  gates:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 90
    env:
      PYTHON_VERSION: "3.13.15"
      NODE_VERSION: "24.21.0"
      UV_VERSION: "0.12.18"
      OPENSPEC_VERSION: "1.11.0"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate exact main source and unused version
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git status --porcelain)"
          test -z "$(git tag --list v0.1.0-rc.1)"
          image=$(sed -n 's/^gitleaks_image=//p' tools/release/tools.lock)
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" dir . --config tools/release/gitleaks.toml
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" git . --config tools/release/gitleaks.toml --log-opts=--all
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install pinned uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Portable checks
        run: |
          python3 tools/release/install_actionlint.py
          /tmp/volt-release-tools/actionlint .github/workflows/release.yml .github/workflows/security.yml .github/workflows/ci.yml
          uv sync --locked
          uv run python -m unittest discover -s tests/engine -v
          uv run python -m unittest discover -s tests/identity -v
          uv run python -m unittest tests.ingestion.test_run -v
          uv run python -m unittest discover -s tests/release -v
          uv run python -m unittest discover -s tests/public_check -v
          uv run python tools/public_check.py .
          npm --prefix ui ci
          npm --prefix ui run build
          (cd ui && npx playwright install --with-deps chromium)
          node --test ui/tests/public-g4-fixtures.test.mjs
          npm --prefix tools/g0_ci/openspec ci
          test "$(tools/g0_ci/openspec/node_modules/.bin/openspec --version)" = "${OPENSPEC_VERSION}"
          tools/g0_ci/openspec/node_modules/.bin/openspec validate --all --strict
      - name: Build immutable candidate image once
        run: |
          out="$RUNNER_TEMP/volt-rc1"
          mkdir -p "$out"
          echo "RELEASE_OUT=$out" >> "$GITHUB_ENV"
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.version=0.1.0-rc.1 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            --label org.opencontainers.image.source="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label org.opencontainers.image.licenses=Apache-2.0 \
            -f Dockerfile.g7 -t volt-rc1:candidate .
          docker image inspect volt-rc1:candidate --format '{{.Id}}' > "$out/image-id.txt"
          docker save --output "$out/image.tar" volt-rc1:candidate
          git archive --format=tar --output="$out/source.tar" "$GITHUB_SHA"
          git bundle create "$out/source.bundle" HEAD
          install -m 0755 tools/g7_local_preview.py "$out/tools-g7-local-preview.py"
          install -m 0644 tools/release/launcher-guide.txt "$out/launcher-guide.txt"
      - name: Exercise fresh offline image load and no-build release path
        run: |
          out="$RUNNER_TEMP/volt-rc1"
          state="$RUNNER_TEMP/volt-rc1-preview-state"
          evidence="$out/local-preview"
          mkdir -p "$evidence"
          export XDG_STATE_HOME="$state"
          cleanup() {
            if test -f "$state/volt/g7-preview/rc1/instance.json"; then
              python3 tools/g7_local_preview.py destroy rc1 || true
            fi
          }
          trap cleanup EXIT
          image_id=$(cat "$out/image-id.txt")
          docker image rm volt-rc1:candidate
          if docker image inspect "$image_id" >/dev/null 2>&1; then
            echo "candidate image unexpectedly remained loaded after removal" >&2
            exit 1
          fi
          docker load --input "$out/image.tar"
          docker image inspect "$image_id" --format '{{.Id}}' | grep -Fx "$image_id"
          python3 tools/g7_local_preview.py init rc1 --api-port 8180 --oidc-port 8190
          python3 tools/g7_local_preview.py start rc1 --no-build \
            --expected-image-id "$image_id" \
            --expected-image-source-revision "$GITHUB_SHA" \
            --expected-image-version 0.1.0-rc.1 \
            --expected-platform linux/amd64
          python3 tools/g7_local_preview.py wait rc1
          python3 tools/g7_local_preview.py link-admin rc1
          python3 tools/g7_local_preview.py smoke rc1 --evidence "$evidence"
          python3 tools/g7_local_preview.py stop rc1
          python3 tools/g7_local_preview.py restart rc1
          python3 tools/g7_local_preview.py wait rc1
          python3 tools/g7_local_preview.py smoke rc1 --readback --evidence "$evidence"
          python3 tools/g7_local_preview.py destroy rc1
          test ! -e "$state/volt/g7-preview/rc1"
      - name: Retain fresh offline install evidence on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc1-fresh-install-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc1/local-preview/
          if-no-files-found: ignore
          retention-days: 30
      - name: Create and verify image-bound notices and SBOMs
        run: |
          python3 tools/notices/prepare_release_sources.py --output "$RELEASE_OUT/source-preparation"
          python3 tools/release/install_syft.py
          python3 tools/notices/collect.py --image "$(cat "$RELEASE_OUT/image-id.txt")" \
            --output "$RELEASE_OUT/notices" --syft /tmp/volt-release-tools/syft \
            --debian-dispositions "$RELEASE_OUT/source-preparation/debian-source-dispositions.json" \
            --debian-developer-keyring "$RELEASE_OUT/source-preparation/debian-developer-keyring.gpg"
          python3 tools/notices/verify.py --directory "$RELEASE_OUT/notices" --image "$(cat "$RELEASE_OUT/image-id.txt")"
      - name: Fail-closed full-image vulnerability scan
        run: |
          python3 tools/release/install_trivy.py
          echo /tmp/volt-release-tools >> "$GITHUB_PATH"
          python3 tools/release/scan.py --image "$(cat "$RELEASE_OUT/image-id.txt")" --expected-image-id "$(cat "$RELEASE_OUT/image-id.txt")" --exceptions tools/release/exceptions.example.json --output "$RELEASE_OUT/release-scan.json"
      - name: Retain full scan report on success or failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc1-scan-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc1/release-scan.json*
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload exact candidate inputs; no publication credentials
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-rc1-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc1/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.ref == 'refs/heads/main' && inputs.publish_approved == true
    needs: gates
    runs-on: ubuntu-24.04
    environment: volt-rc1-publication
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v4.3.0
        with:
          name: volt-rc1-candidate-${{ github.sha }}
          path: ${{ runner.temp }}/volt-rc1
      - name: Verify explicit approval and required environment reviewers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/environments/volt-rc1-publication" > "$RUNNER_TEMP/environment.json"
          python3 tools/release/guards.py --approved '${{ inputs.publish_approved }}' \
            --environment-json "$RUNNER_TEMP/environment.json" \
            --approval-reference "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
      - name: Recheck exact source and immutable destination tags
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test -z "$(git tag --list v0.1.0-rc.1)"
          python3 tools/release/registry.py --version-tag 0.1.0-rc.1 --sha-tag "sha-$GITHUB_SHA"
      - name: Install pinned Cosign and establish offline verification root
        run: |
          python3 tools/release/install_cosign.py
          echo /tmp/volt-release-tools >> "$GITHUB_PATH"
          /tmp/volt-release-tools/cosign initialize
      - name: Publish the already-gated image without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image_id=$(cat "$RUNNER_TEMP/volt-rc1/image-id.txt")
          docker load --input "$RUNNER_TEMP/volt-rc1/image.tar"
          docker image inspect "$image_id" --format '{{.Id}}' | grep -Fx "$image_id"
          registry=ghcr.io/njvenis/volt
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
          docker tag "$image_id" "$registry:0.1.0-rc.1"
          docker tag "$image_id" "$registry:sha-$GITHUB_SHA"
          docker push "$registry:sha-$GITHUB_SHA"
          docker push "$registry:0.1.0-rc.1"
          repo_digest=$(docker image inspect "$registry:0.1.0-rc.1" --format '{{index .RepoDigests 0}}')
          digest="${repo_digest##*@}"
          test "${digest#sha256:}" != "$digest"
          printf '%s\n' "$digest" > "$RUNNER_TEMP/volt-rc1/registry-digest.txt"
          /tmp/volt-release-tools/cosign sign --yes "$registry@$digest"
          /tmp/volt-release-tools/cosign attest --yes --type spdxjson \
            --predicate "$RUNNER_TEMP/volt-rc1/notices/sbom.spdx.json" "$registry@$digest"
          python3 - <<'PY'
          import json, os
          server = os.environ["GITHUB_SERVER_URL"]
          repository = os.environ["GITHUB_REPOSITORY"]
          source = f"{server}/{repository}"
          workflow_ref = os.environ["GITHUB_WORKFLOW_REF"]
          sha = os.environ["GITHUB_SHA"]
          predicate = {
              "buildDefinition": {
                  "buildType": "https://github.com/Attestations/GitHubActionsWorkflow@v1",
                  "externalParameters": {
                      "workflow": {"ref": workflow_ref, "repository": source},
                      "source": {"uri": source, "ref": sha},
                  },
                  "internalParameters": {},
                  "resolvedDependencies": [{"uri": f"git+{source}", "digest": {"gitCommit": sha}}],
              },
              "runDetails": {
                  "builder": {"id": "https://github.com/actions/runner"},
                  "metadata": {"invocationId": f"{server}/{repository}/actions/runs/{os.environ['GITHUB_RUN_ID']}"},
              },
          }
          with open(os.path.join(os.environ["RUNNER_TEMP"], "volt-rc1", "provenance.json"), "w") as output:
              json.dump(predicate, output, sort_keys=True)
              output.write("\n")
          PY
          /tmp/volt-release-tools/cosign attest --yes --type slsaprovenance1 \
            --predicate "$RUNNER_TEMP/volt-rc1/provenance.json" "$registry@$digest"
          python3 tools/release/registry.py --version-tag 0.1.0-rc.1 --sha-tag "sha-$GITHUB_SHA" --expected-digest "$digest"
          python3 tools/release/publication_verify.py --cosign /tmp/volt-release-tools/cosign --digest "$digest" --source "$GITHUB_SHA" --image-id "$image_id" --spdx "$RUNNER_TEMP/volt-rc1/notices/sbom.spdx.json" --provenance "$RUNNER_TEMP/volt-rc1/provenance.json" --notice-manifest "$RUNNER_TEMP/volt-rc1/notices/notice-manifest.json"
      - name: Sign and assemble the offline image archive
        run: |
          out="$RUNNER_TEMP/volt-rc1"
          cp -a "$out/notices/." "$out/"
          cp tools/release/VERIFY.txt "$out/VERIFY.txt"
          python3 tools/release/archive.py prepare --directory "$out" \
            --version 0.1.0-rc.1 --source-sha "$GITHUB_SHA" \
            --image-id "$(cat "$out/image-id.txt")" --registry-digest "$(cat "$out/registry-digest.txt")" \
            --platform linux/amd64
          python3 tools/release/archive.py sign --directory "$out" --cosign /tmp/volt-release-tools/cosign \
            --production-oidc --approval "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          python3 tools/release/archive.py pack --directory "$out" \
            --archive "$RUNNER_TEMP/volt-0.1.0-rc.1-linux-amd64.tar"
          python3 tools/release/archive.py verify --archive "$RUNNER_TEMP/volt-0.1.0-rc.1-linux-amd64.tar" \
            --cosign /tmp/volt-release-tools/cosign --source-sha "$GITHUB_SHA" \
            --image-id "$(cat "$out/image-id.txt")"
      - name: Retain signed offline archive for independent download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: volt-0.1.0-rc.1-linux-amd64
          path: ${{ runner.temp }}/volt-0.1.0-rc.1-linux-amd64.tar
          if-no-files-found: error
          retention-days: 90
