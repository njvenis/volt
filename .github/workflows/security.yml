name: Security checks

on:
  pull_request:
  schedule:
    - cron: '23 4 * * 1'
  push:
    tags:
      - 'v*-rc.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # pinned v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # pinned v3
  secret-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks full reachable history
        run: |
          image=$(sed -n 's/^gitleaks_image=//p' tools/release/tools.lock)
          test -n "$image"
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" dir . --config tools/release/gitleaks.toml
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" -w /repo "$image" git . --config tools/release/gitleaks.toml --log-opts=--all
