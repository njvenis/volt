# Alembic configuration for the UVM separate-database metadata (G1, D-07 pins).
#
# sqlalchemy.url is intentionally blank: set it per environment before
# running alembic. The value is the separate UVM PostgreSQL database
# (pinned psycopg driver; no DefectDojo CE tables live here, CR-01).
# Alembic raises a clear RuntimeError (see migrations/env.py) when it
# runs with the URL unset.
#
# Two supported ways to provide it (implemented by migrations/env.py):
#   1. Export the UVM_DB_URL environment variable; it is used whenever
#      sqlalchemy.url below stays blank:
#        UVM_DB_URL=postgresql+psycopg://user:pass@host:5432/uvm \
#            alembic upgrade head
#   2. Or edit this line per environment (this line wins over the
#      environment variable):
#        sqlalchemy.url = postgresql+psycopg://user:pass@host:5432/uvm
#      then:  alembic upgrade head   /   alembic downgrade base
#
# Offline SQL rendering needs a URL too (no connection is made, but the
# dialect must be known):
#   UVM_DB_URL=postgresql+psycopg://user:pass@host:5432/uvm \
#       alembic upgrade head --sql


[alembic]
script_location = migrations
sqlalchemy.url =
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
