# VOLT runtime dependencies. UVM remains the internal Python package name for
# compatibility with existing deployment and import paths.
[project]
name = "uvm"
version = "0.1.0"
description = "VOLT — DefectDojo CE-based vulnerability ownership and lifecycle tracking"
requires-python = ">=3.13.15"
dependencies = [
    "fastapi==0.141.1",
    "sqlalchemy==2.0.54",
    "alembic==1.20.0",
    "psycopg[binary]==3.3.6",
    "uvicorn==0.54.0",
    "authlib==1.9.1",
    "httpx2==2.13.1",
    "cryptography==50.0.1",
]
